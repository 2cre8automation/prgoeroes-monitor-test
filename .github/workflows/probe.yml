name: Verkenning bronnen
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/probe.py > tools/probe-output.txt 2>&1 || true
      - run: |
          git config user.name "prgoeroes-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add tools/probe-output.txt tools/brand
          git diff --cached --quiet || git commit -m "Verkenning $(date -u +%F)"
          git pull --rebase -q && git push
