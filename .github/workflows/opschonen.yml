name: Opschonen
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Opschonen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/opschonen.py > tools/opschonen-output.txt 2>&1 || true
      - run: |
          git config user.name "prgoeroes-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add tools/opschonen-output.txt
          git diff --cached --quiet || git commit -m "Opschonen $(date -u +%F)"
          git pull --rebase -q origin main && git push
