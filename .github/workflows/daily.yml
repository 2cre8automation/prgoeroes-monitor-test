name: Monitor

on:
  schedule:
    - cron: "17 5,13,21 * * *"   # 3x per dag; Persberichten.com-feed toont ~12 uur
  workflow_dispatch: {}      # handmatig starten via de knop "Run workflow"

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Monitor draaien
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python monitor.py
      - name: Resultaten opslaan
        run: |
          git config user.name "prgoeroes-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Monitor $(date -u +%F)"
          # Data komt uit de database, dus bij een conflict telt onze export (-X theirs = onze commit).
          for i in 1 2 3; do
            git pull --rebase -X theirs -q origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
