name: Monitor

on:
  schedule:
    - cron: "17 */3 * * *"   # elke 3 uur (Persberichten.com-feed toont maar ~12 uur)
  workflow_dispatch: {}      # handmatig starten via de knop "Run workflow"

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Monitor draaien
        run: python monitor.py
      - name: Resultaten opslaan
        run: |
          git config user.name "prgoeroes-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Monitor $(date -u +%F)"
          git push
