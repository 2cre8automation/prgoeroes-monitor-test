name: Database bijwerken

on:
  push:
    branches: [main]
    paths: ["db/setup.sql"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: setup.sql toepassen
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then echo "SUPABASE_DB_URL ontbreekt" | tee /tmp/db.log; exit 1; fi
          echo "DB-URL lengte: ${#DB_URL}, begint met: ${DB_URL%%://*}, host: $(echo "$DB_URL" | sed -E "s#.*@([^:/]+).*#\1#")" | tee -a /tmp/db.log
          sudo apt-get install -y -qq postgresql-client >/dev/null
          set -o pipefail
          { psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f db/setup.sql && \
            psql "$DB_URL" -c "select table_name from information_schema.tables where table_schema='public' order by 1"; } \
            2>&1 | sed -E 's#postgres(ql)?://[^ ]*#<db-url>#g' | tee -a /tmp/db.log
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Klanten, bronnen en bestaande publicaties overzetten
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python db/seed.py 2>&1 | tee -a /tmp/db.log
      - name: Resultaat bewaren
        if: always()
        run: |
          mkdir -p db && { date -u; cat /tmp/db.log 2>/dev/null; } > db/last-run.txt
          git config user.name "prgoeroes-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add db/last-run.txt
          git diff --cached --quiet || git commit -m "Database-run log"
          git pull --rebase -q origin main && git push
